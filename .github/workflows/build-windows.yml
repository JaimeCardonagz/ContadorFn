name: Build Windows

on:
  push:
    branches: [main]
    # Los cambios que solo tocan documentación no recompilan el .exe
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # --no-bundle: solo el .exe portable, sin instalador
      - run: npm run tauri build -- --no-bundle

      - uses: actions/upload-artifact@v7
        with:
          name: FortniteChestCounter-windows
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
